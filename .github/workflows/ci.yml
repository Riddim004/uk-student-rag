name: CI

on:
  push:
    branches: [main, rebuild/evidence-pack]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q ragkit scripts

      - name: Unit, API, and artifact tests
        run: pytest -q

      - name: No-network CLI smoke test
        run: |
          python -m ragkit "How many hours can I work during term time?" \
            --embedding-backend hashing --no-rerank --no-llm --json > smoke.json
          python - <<'PY'
          import json
          payload = json.load(open("smoke.json", encoding="utf-8"))
          assert payload["question"]
          assert payload["product_mode"] == "extractive"
          assert payload["corpus"]["chunks"] == 167
          print("smoke ok:", payload["gate"])
          PY

      - name: Confirm evidence is present
        run: |
          test -f evidence/eval/report.md
          test -f evidence/reliability/incidents.md
          test -f evidence/performance/report.md
          test -f evidence/cost/report.md
